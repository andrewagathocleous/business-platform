packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 does not run dependency build scripts unless they are approved here.
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  esbuild: true
  nx: true
  prisma: true
  unrs-resolver: true

# @nx/nest 23.3 peers Nest <12. Nest stays on 12.1.x, and the API is built with tsc.
peerDependencyRules:
  allowedVersions:
    "@nestjs/common": "12"
    "@nestjs/core": "12"
